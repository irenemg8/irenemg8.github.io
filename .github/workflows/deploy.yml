name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Work around npm's optional-dependency bug (npm/cli#4828): on Linux CI,
        # `npm ci` can skip the platform-specific Rollup binary
        # (@rollup/rollup-linux-x64-gnu), which breaks `vite build`. Dropping the
        # lock and doing a fresh install resolves the correct binary for the runner.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build
        run: npm run build # Vite -> ./dist
        env:
          # Optional: add a repo secret of the same name to enable real
          # donation emails + shared leaderboard (Google Apps Script URL).
          VITE_DONATE_ENDPOINT: ${{ secrets.VITE_DONATE_ENDPOINT }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
