<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pecita:wght@400&display=swap" rel="stylesheet">
    <style>
        /* --- Light Mode Variables --- */
        :root {
            --bg-color-light: #F3F4F6; /* Light gray (Tailwind gray-100) */
            --shape-color-light: #6366F1; /* Indigo-500 */
            --shape-highlight-light: #818CF8; /* Indigo-400 */
            --scrollbar-track-light: #e5e7eb; /* Gray-200 */
            --scrollbar-thumb-light: #9ca3af; /* Gray-400 */
            --scrollbar-thumb-hover-light: #6b7280; /* Gray-500 */
        }

        /* --- Dark Mode Variables --- */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color-dark: #1F2937; /* Dark gray (Tailwind gray-800) */
                --shape-color-dark: #818CF8; /* Indigo-400 (lighter for dark bg) */
                --shape-highlight-dark: #A5B4FC; /* Indigo-300 (even lighter for dark bg highlight) */
                --scrollbar-track-dark: #374151; /* Gray-700 */
                --scrollbar-thumb-dark: #6b7280; /* Gray-500 */
                --scrollbar-thumb-hover-dark: #9ca3af; /* Gray-400 */
            }
        }

        body {
            font-family: 'Pecita', cursive; /* Fallback font */
            overflow: hidden; /* Hide scrollbars */
            /* Apply background color using CSS variables */
            background-color: var(--bg-color-light);
            transition: background-color 0.3s ease; /* Smooth transition for theme changes */
        }

        /* Apply dark mode styles directly if preferred */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: var(--bg-color-dark);
            }
        }

        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            gap: 12px; /* Space between shapes */
        }

        .shape {
            width: 20px;
            height: 20px;
            border-radius: 4px; /* Slightly rounded squares */
            background-color: var(--shape-color-light); /* Default to light mode color */
            animation: figmaLoading 1.5s infinite ease-in-out;
            transition: background-color 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            .shape {
                background-color: var(--shape-color-dark);
            }
        }

        .shape-1 {
            animation-delay: 0s;
        }
        .shape-2 {
            animation-delay: 0.15s;
        }
        .shape-3 {
            animation-delay: 0.3s;
        }
        .shape-4 {
            animation-delay: 0.45s;
        }

        @keyframes figmaLoading {
            0%, 100% {
                transform: scale(0.8) translateY(0);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.2) translateY(-10px);
                opacity: 1;
                /* The background color in animation will be set by JS or a more complex CSS setup if needed for dynamic theme in animation keyframes */
                /* For simplicity, we'll keep a single highlight color here, or you can create duplicate keyframes for dark mode */
            }
        }

        /* Keyframes for light mode - specific highlight */
        @media (prefers-color-scheme: light) {
            @keyframes figmaLoading {
                0%, 100% {
                    transform: scale(0.8) translateY(0);
                    opacity: 0.7;
                }
                50% {
                    transform: scale(1.2) translateY(-10px);
                    opacity: 1;
                    background-color: var(--shape-highlight-light);
                }
            }
        }
        
        /* Keyframes for dark mode - specific highlight */
         @media (prefers-color-scheme: dark) {
            @keyframes figmaLoading { /* Re-declare for dark mode to use dark variable */
                0%, 100% {
                    transform: scale(0.8) translateY(0);
                    opacity: 0.7;
                    /* Ensure initial state also respects theme if different from .shape base */
                     background-color: var(--shape-color-dark); 
                }
                50% {
                    transform: scale(1.2) translateY(-10px);
                    opacity: 1;
                    background-color: var(--shape-highlight-dark);
                }
            }
            /* Apply dark mode animation to shapes */
            .shape {
                 animation-name: figmaLoading; /* Ensure it uses the potentially re-declared keyframes */
            }
        }


        /* Custom scrollbar styles using CSS variables */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover-light);
        }

        @media (prefers-color-scheme: dark) {
            ::-webkit-scrollbar-track {
                background: var(--scrollbar-track-dark);
            }
            ::-webkit-scrollbar-thumb {
                background: var(--scrollbar-thumb-dark);
            }
            ::-webkit-scrollbar-thumb:hover {
                background: var(--scrollbar-thumb-hover-dark);
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="loader-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <script>
        // Script for potential future redirection or asset loading checks
        setTimeout(() => {
            // Redirige a la página principal de Next.js (ruta raíz)
            window.location.href = '/app';
        }, 3000); // Redirige después de 3 segundos

        // Optional: Force re-evaluation of animation if theme changes dynamically
        // This is more complex and might not be needed if keyframes are distinct enough or transitions handle it.

        //    const shapes = document.querySelectorAll('.shape');
        //    shapes.forEach(shape => {
        //        shape.style.animation = 'none';
        //        // Trigger reflow
        //        void shape.offsetWidth; 
        //        shape.style.animation = ''; 
        //    });
        // });
    </script>
</body>
</html>
